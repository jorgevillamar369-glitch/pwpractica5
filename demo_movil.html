<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pwa5 · Vista móvil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --fondo: #0d1711;
            --papel: #eef1ea;
            --acento: #2f6b4f;
            --tinta: #f3f7f1;
            --tenue: #a9b8ad;
            --linea: rgba(223, 230, 220, .14);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(circle at 24% 18%, #22352a 0%, #0d1711 58%, #080d0a 100%);
            color: var(--tinta);
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        }

        .escenario {
            display: flex;
            align-items: center;
            gap: 56px;
            padding: 20px;
        }

        .texto {
            width: 360px;
            flex: 0 0 auto;
        }

        .sobretitulo {
            margin: 0 0 14px;
            color: #8fae9b;
            font-family: "IBM Plex Mono", monospace;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        .texto h1 {
            margin: 0 0 14px;
            color: var(--tinta);
            font-size: 34px;
            font-weight: 600;
            letter-spacing: -.03em;
            line-height: 1.12;
            transition: opacity .22s ease;
        }

        .texto p {
            margin: 0;
            color: var(--tenue);
            font-size: 14px;
            line-height: 1.55;
            transition: opacity .22s ease;
        }

        .paso {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-top: 26px;
            padding-top: 18px;
            border-top: 1px solid var(--linea);
        }

        .paso strong {
            color: #9fc3ac;
            font-family: "IBM Plex Mono", monospace;
            font-size: 26px;
            font-weight: 500;
            line-height: 1;
        }

        .paso span {
            color: #8fae9b;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        .nota {
            margin-top: 22px !important;
            color: #7f9487 !important;
            font-size: 11px !important;
        }

        .telefono-marco {
            position: relative;
            width: 356px;
            height: 747px;
            flex: 0 0 auto;
        }

        .telefono {
            position: absolute;
            top: 0;
            left: 0;
            width: 414px;
            height: 868px;
            padding: 12px;
            border-radius: 56px;
            background: linear-gradient(145deg, #34463a, #0a0f0c 65%);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, .55),
                inset 0 0 0 1px rgba(255, 255, 255, .09);
            transform: scale(.86);
            transform-origin: top left;
        }

        .pantalla {
            position: relative;
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: column;
            overflow: hidden;
            border-radius: 44px;
            background: var(--papel);
        }

        .muesca {
            position: absolute;
            top: 7px;
            left: 50%;
            z-index: 3;
            width: 104px;
            height: 20px;
            border-radius: 12px;
            background: #050806;
            transform: translateX(-50%);
        }

        .barra-estado {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 26px;
            padding: 0 22px;
            background: #0b120e;
            color: #dfe6dc;
            font-family: "IBM Plex Mono", monospace;
            font-size: 9px;
            letter-spacing: .04em;
        }

        .barra-estado span:nth-child(2) {
            color: #9fb2a4;
        }

        iframe {
            flex: 1;
            width: 100%;
            border: 0;
            background: var(--papel);
        }

        .inicio {
            display: grid;
            place-items: center;
            height: 20px;
            background: #0b120e;
        }

        .inicio span {
            width: 104px;
            height: 4px;
            border-radius: 99px;
            background: rgba(255, 255, 255, .5);
        }

        @media (max-height: 820px) {
            .telefono {
                transform: scale(.79);
            }

            .telefono-marco {
                width: 327px;
                height: 686px;
            }

            .texto h1 {
                font-size: 30px;
            }
        }

        @media (max-width: 1000px) {
            .escenario {
                gap: 28px;
            }

            .texto {
                width: 250px;
            }

            .texto h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="escenario">
        <section class="texto">
            <p class="sobretitulo">Práctica 5 · Vista adaptable</p>
            <h1 id="paso-titulo">Inicio de sesión</h1>
            <p id="paso-detalle">El formulario ocupa todo el ancho y conserva la misma identidad visual.</p>

            <div class="paso">
                <strong id="paso-numero">01</strong>
                <span>de 06</span>
            </div>

            <p class="nota">La misma aplicación, en una pantalla de 390 px.</p>
        </section>

        <div class="telefono-marco">
            <div class="telefono">
                <div class="pantalla">
                    <div class="muesca"></div>
                    <div class="barra-estado">
                        <span>9:41</span>
                        <span>Pwa5 · 4G</span>
                        <span>100%</span>
                    </div>
                    <iframe id="movil" src="login.php" title="Vista móvil de Pwa5"></iframe>
                    <div class="inicio"><span></span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function ocultarScroll() {
            try {
                const marco = document.getElementById('movil');
                const doc = marco.contentDocument;
                if (!doc || doc.getElementById('estilo-movil')) {
                    return;
                }
                const estilo = doc.createElement('style');
                estilo.id = 'estilo-movil';
                estilo.textContent = '::-webkit-scrollbar{width:0;height:0}html{scrollbar-width:none}';
                doc.head.appendChild(estilo);
            } catch (error) {
                // Si el navegador bloquea el acceso, la página sigue funcionando.
            }
        }

        const marcoMovil = document.getElementById('movil');
        marcoMovil.addEventListener('load', ocultarScroll);
        ocultarScroll();
    </script>
</body>
</html>
